version: 2
updates:
  # Frontend (Next.js) — target the staging branch so bumps follow the
  # staging -> main gitflow instead of landing on main directly.
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  # Backend (uv) — same staging target.
  - package-ecosystem: "uv"
    directory: "/backend"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
