env:
  NODE_ENV: prod
  BACKEND_URL: http://localhost:8000

envSecrets:
  MONGODB_URI: tak-situational-demo
  DATABASE_NAME: tak-situational-demo
  DITTO_URL_EP: tak-situational-demo
  DITTO_API_KEY: tak-situational-demo
  LLM_API_KEY: tak-situational-demo
  LLM_BASE_URL: tak-situational-demo
  LLM_MODEL: tak-situational-demo
  GENYMOTION_PAAS_HOST_ALPHA: tak-situational-demo
  GENYMOTION_PAAS_TOKEN_ALPHA: tak-situational-demo
  GENYMOTION_PAAS_HOST_BRAVO: tak-situational-demo
  GENYMOTION_PAAS_TOKEN_BRAVO: tak-situational-demo

sidecarContainers:
  - name: backend
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/tak-situational-demo-backend:latest
    env:
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: MONGODB_URI
      - name: DATABASE_NAME
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: DATABASE_NAME
      - name: DITTO_URL_EP
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: DITTO_URL_EP
      - name: DITTO_API_KEY
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: DITTO_API_KEY
      - name: LLM_API_KEY
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: LLM_API_KEY
      - name: LLM_BASE_URL
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: LLM_BASE_URL
      - name: LLM_MODEL
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: LLM_MODEL
      - name: GENYMOTION_PAAS_HOST_ALPHA
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: GENYMOTION_PAAS_HOST_ALPHA
      - name: GENYMOTION_PAAS_TOKEN_ALPHA
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: GENYMOTION_PAAS_TOKEN_ALPHA
      # BRAVO instance isn't live yet (pending Tue 2026-09-08 contract) — optional so a
      # secret without these keys yet doesn't block the pod from starting.
      - name: GENYMOTION_PAAS_HOST_BRAVO
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: GENYMOTION_PAAS_HOST_BRAVO
            optional: true
      - name: GENYMOTION_PAAS_TOKEN_BRAVO
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: GENYMOTION_PAAS_TOKEN_BRAVO
            optional: true

serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-prod-cicd-irsa"

## Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: alberto.camarena@mongodb.com
