env:
  NODE_ENV: prod
  BACKEND_URL: http://localhost:8000

envSecrets:
  MONGODB_URI: tak-situational-demo
  DATABASE_NAME: tak-situational-demo

sidecarContainers:
  - name: backend
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/tak-situational-demo-backend:latest
    env:
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: MONGODB_URI
      - name: DATABASE_NAME
        valueFrom:
          secretKeyRef:
            name: tak-situational-demo
            key: DATABASE_NAME

serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-prod-cicd-irsa"

## Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: alberto.camarena@mongodb.com
