#     image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/defence-tak-ditto-sync-backend:latest
#     env:
#       - name: MONGODB_URI
#         valueFrom:
#           secretKeyRef:
#             name: defence-tak-ditto-sync-secrets
#             key: MONGODB_URI
#       - name: DATABASE_NAME
#         valueFrom:
#           secretKeyRef:
#             name: defence-tak-ditto-sync-secrets
#             key: DATABASE_NAME

## AWS IRSA
serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-staging-cicd-irsa"
