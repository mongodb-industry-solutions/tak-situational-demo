[project]
name = "tak-situational-demo"
version = "0.1.0"
description = "Command vehicle web dashboard for MongoDB + Ditto tactical edge demo"
authors = [{name = "MongoDB Industry Solutions"}]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymongo>=4.10.1",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
