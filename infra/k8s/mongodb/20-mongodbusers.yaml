# SCRAM users for the MongoDB EA replica set, managed via MongoDBUser CRs.
#
# The password Secrets referenced below (mongodb-*-password) are NOT committed —
# scripts/setup.sh generates them with random values before applying this file.
#
# For each user the operator publishes a Secret holding the credentials it
# actually set, named `<mongodb-resource>-<user-resource>-<db>`, e.g.
# `tak-mongodb-tak-dashboard-admin`. scripts/setup.sh reads the passwords from
# those Secrets (never from the seed Secrets) when it builds connection strings,
# so the URIs always authenticate.
#
# VERSION-SENSITIVE: confirm `spec.mongodbResourceRef` on the installed CRD:
#   kubectl explain mongodbuser.spec
---
# Cluster admin — used for Compass/mongosh from the host and by the post-init Job.
apiVersion: mongodb.com/v1
kind: MongoDBUser
metadata:
  name: tak-admin
  namespace: mongodb
spec:
  username: admin
  db: admin
  mongodbResourceRef:
    name: tak-mongodb
  passwordSecretKeyRef:
    name: mongodb-admin-password
    key: password
  roles:
    - name: root
      db: admin
---
# The dashboard backend. Reads tracks/mapitems/chat/files/alerts and writes
# command actions (chat messages, markers, tombstones) plus AI session history.
apiVersion: mongodb.com/v1
kind: MongoDBUser
metadata:
  name: tak-dashboard
  namespace: mongodb
spec:
  username: dashboard
  db: admin
  mongodbResourceRef:
    name: tak-mongodb
  passwordSecretKeyRef:
    name: mongodb-dashboard-password
    key: password
  roles:
    - name: readWrite
      db: tak_demo
---
# The Ditto MongoDB Connector.
#
# `readWrite` on the synced database is the documented minimum. It also covers
# the connector's own metadata collections (`__ditto_connector_sessions`,
# `__ditto_unsynced_documents`), which it creates on startup.
#
# NOTE: the extra `read` on the `config` database that Ditto documents is only
# required when connecting through `mongos` (a sharded cluster). This is a
# single replica set, so it is not needed here.
apiVersion: mongodb.com/v1
kind: MongoDBUser
metadata:
  name: tak-ditto-connector
  namespace: mongodb
spec:
  username: ditto-connector
  db: admin
  mongodbResourceRef:
    name: tak-mongodb
  passwordSecretKeyRef:
    name: mongodb-ditto-connector-password
    key: password
  roles:
    - name: readWrite
      db: tak_demo
