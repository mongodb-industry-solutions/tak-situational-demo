env:
  NODE_ENV: staging
  # Backend API URL — localhost for multi-container pod (frontend + backend sidecar in same pod)
  BACKEND_URL: http://localhost:8080

## Secrets — set via: helm ksec set <secret-group> KEY="value"
envSecrets:
  MONGODB_URI: defence-tak-ditto-sync-secrets
  DATABASE_NAME: defence-tak-ditto-sync-secrets

## Sidecar (multi-container pod) — uncomment if using multi-container pod deployment
# sidecarContainers:
